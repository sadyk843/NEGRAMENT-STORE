<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
background: var(--bg-color);
color: var(--text-color);
padding: 20px;
max-width: 500px;
margin: 0 auto;
min-height: 100vh;
transition: background 0.5s ease, color 0.5s ease;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
-webkit-tap-highlight-color: transparent;
}

body.dark {
--bg-color: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 100%);
--text-color: #ffffff;
--card-bg: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
--card-border: rgba(255,255,255,0.08);
--header-bg: rgba(255,255,255,0.05);
--button-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
--secondary-text: rgba(255,255,255,0.6);
--search-bg: rgba(255,255,255,0.05);
--search-border: rgba(255,255,255,0.1);
--input-bg: rgba(255,255,255,0.1);
--game-bg: rgba(255,255,255,0.03);
--success-color: #00c851;
--danger-color: #ff4444;
}

body.light {
--bg-color: linear-gradient(145deg, #f5f7fa 0%, #e9ecf0 100%);
--text-color: #1a1a2e;
--card-bg: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 100%);
--card-border: rgba(0,0,0,0.08);
--header-bg: rgba(255,255,255,0.8);
--button-gradient: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%);
--secondary-text: rgba(0,0,0,0.6);
--search-bg: rgba(255,255,255,0.8);
--search-border: rgba(0,0,0,0.1);
--input-bg: rgba(0,0,0,0.05);
--game-bg: rgba(0,0,0,0.02);
--success-color: #00c851;
--danger-color: #ff4444;
}

/* Шапка */
.store-header {
background: var(--header-bg);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(--card-border);
border-radius: 24px;
padding: 18px 24px;
margin-bottom: 20px;
font-size: 22px;
font-weight: 800;
text-align: center;
color: var(--text-color);
text-shadow: 0 2px 10px rgba(0,200,255,0.3);
letter-spacing: 1px;
box-shadow: 0 8px 32px rgba(0,0,0,0.2);
display: flex;
justify-content: space-between;
align-items: center;
animation: slideDown 0.6s ease;
}

.theme-toggle {
background: var(--button-gradient);
border: none;
border-radius: 40px;
padding: 8px 16px;
color: white;
font-weight: 600;
cursor: pointer;
transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
box-shadow: 0 4px 12px rgba(0,100,255,0.3);
display: flex;
align-items: center;
gap: 8px;
flex-shrink: 0;
font-size: 16px;
}

.theme-toggle:hover {
transform: scale(1.05) rotate(2deg);
box-shadow: 0 8px 20px rgba(0,100,255,0.5);
}

.theme-icon {
display: inline-block;
transition: transform 0.5s ease;
font-size: 20px;
}

.theme-toggle:hover .theme-icon {
transform: rotate(180deg) scale(1.2);
}

.moon { animation: float 4s ease-in-out infinite; }
.sun { animation: spinSun 12s linear infinite, glow 3s ease-in-out infinite; }

@keyframes float {
0% { transform: translateY(0px); }
50% { transform: translateY(-5px); }
100% { transform: translateY(0px); }
}

@keyframes spinSun {
from { transform: rotate(0deg); }
to { transform: rotate(360deg); }
}

@keyframes glow {
0% { filter: drop-shadow(0 0 2px #ffd700); }
50% { filter: drop-shadow(0 0 12px #ffaa00); }
100% { filter: drop-shadow(0 0 2px #ffd700); }
}

/* Кнопки навигации */
.nav-buttons {
display: flex;
gap: 12px;
margin-bottom: 20px;
animation: slideUp 0.5s ease 0.1s both;
}

.nav-btn {
flex: 1;
background: var(--card-bg);
border: 1px solid var(--card-border);
border-radius: 20px;
padding: 16px;
font-size: 18px;
font-weight: 700;
cursor: pointer;
transition: all 0.3s ease;
color: var(--text-color);
text-align: center;
position: relative;
overflow: hidden;
}

.nav-btn::before {
content: '';
position: absolute;
top: -2px;
left: -2px;
right: -2px;
bottom: -2px;
background: linear-gradient(90deg, #00c6ff, #0072ff, #00c6ff);
background-size: 200% 100%;
border-radius: 22px;
opacity: 0;
transition: opacity 0.3s ease;
z-index: -1;
animation: gradientShift 3s linear infinite;
}

.nav-btn.active {
background: var(--button-gradient);
color: white;
border-color: transparent;
}

.nav-btn:hover::before {
opacity: 1;
}

@keyframes gradientShift {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

/* Индикаторы */
.section-indicators {
display: flex;
justify-content: center;
gap: 12px;
margin: 15px 0;
}

.indicator {
width: 10px;
height: 10px;
border-radius: 5px;
background: var(--card-border);
transition: all 0.3s ease;
cursor: pointer;
}

.indicator:hover {
background: var(--button-gradient);
transform: scale(1.2);
}

.indicator.active {
width: 30px;
background: var(--button-gradient);
}

/* Контейнер для свайпа */
.swipe-container {
width: 100%;
overflow: hidden;
position: relative;
margin-bottom: 20px;
}

.sections-wrapper {
display: flex;
transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
width: 200%;
}

.section {
width: 50%;
padding: 0 5px;
}

/* Анимации */
@keyframes slideDown {
from {
opacity: 0;
transform: translateY(-30px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

@keyframes slideUp {
from {
opacity: 0;
transform: translateY(30px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

@keyframes fadeIn {
from { opacity: 0; }
to { opacity: 1; }
}

@keyframes scaleIn {
from {
opacity: 0;
transform: scale(0.95);
}
to {
opacity: 1;
transform: scale(1);
}
}

.content-transition {
animation: fadeIn 0.4s ease;
}

.page-enter {
animation: scaleIn 0.4s ease;
}

/* Поиск */
.search-container {
margin-bottom: 20px;
animation: slideUp 0.5s ease 0.2s both;
}

.search-wrapper {
position: relative;
width: 100%;
}

.search-input {
width: 100%;
padding: 16px 50px 16px 20px;
background: var(--search-bg);
border: 1px solid var(--search-border);
border-radius: 20px;
font-size: 16px;
color: var(--text-color);
backdrop-filter: blur(10px);
transition: all 0.3s ease;
}

.search-input:focus {
outline: none;
border-color: #00c6ff;
box-shadow: 0 0 0 3px rgba(0,198,255,0.1);
transform: scale(1.02);
}

.search-clear {
position: absolute;
right: 15px;
top: 50%;
transform: translateY(-50%);
width: 24px;
height: 24px;
border-radius: 50%;
background: var(--card-border);
color: var(--text-color);
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
font-size: 18px;
transition: all 0.3s ease;
opacity: 0;
pointer-events: none;
}

.search-clear.visible {
opacity: 1;
pointer-events: auto;
}

.search-clear:hover {
background: var(--button-gradient);
color: white;
}

.search-results-count {
font-size: 14px;
color: var(--secondary-text);
margin-top: 8px;
margin-bottom: 8px;
padding-left: 5px;
}

/* Сетка */
.games-grid {
display: flex;
flex-direction: column;
gap: 16px;
}

.game-card {
background: var(--card-bg);
backdrop-filter: blur(10px);
border: 1px solid var(--card-border);
border-radius: 28px;
padding: 24px;
cursor: pointer;
transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
position: relative;
overflow: hidden;
animation: cardAppear 0.5s ease;
animation-fill-mode: both;
}

.game-card:nth-child(1) { animation-delay: 0.1s; }
.game-card:nth-child(2) { animation-delay: 0.2s; }
.game-card:nth-child(3) { animation-delay: 0.3s; }

.game-card::before {
content: '';
position: absolute;
top: 0;
left: -100%;
width: 100%;
height: 100%;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.game-card:hover::before {
left: 100%;
}

.game-card:hover {
transform: translateY(-4px) scale(1.02);
border-color: rgba(64, 224, 255, 0.5);
box-shadow: 0 16px 32px rgba(0,200,255,0.2);
}

.game-title {
font-size: 24px;
font-weight: 700;
margin-bottom: 8px;
background: linear-gradient(135deg, var(--text-color) 0%, #aaccff 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
transition: transform 0.3s ease;
}

.game-card:hover .game-title {
transform: translateX(5px);
}

.game-desc {
font-size: 15px;
color: var(--secondary-text);
font-weight: 500;
margin-bottom: 16px;
transition: color 0.3s ease;
}

.game-card:hover .game-desc {
color: var(--text-color);
}

.game-stats {
display: flex;
gap: 20px;
margin-top: 12px;
}

.stat-item {
display: flex;
align-items: center;
gap: 5px;
font-size: 14px;
color: var(--secondary-text);
transition: transform 0.3s ease;
}

.game-card:hover .stat-item {
transform: scale(1.05);
}

.play-btn {
background: var(--button-gradient);
border: none;
border-radius: 20px;
padding: 16px;
width: 100%;
font-size: 18px;
font-weight: 700;
cursor: pointer;
transition: all 0.4s ease;
color: white;
margin-top: 16px;
position: relative;
overflow: hidden;
}

.play-btn::before {
content: '';
position: absolute;
top: 50%;
left: 50%;
width: 0;
height: 0;
border-radius: 50%;
background: rgba(255,255,255,0.2);
transform: translate(-50%, -50%);
transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.play-btn:active::before {
width: 300px;
height: 300px;
}

.play-btn:hover {
transform: scale(0.98);
box-shadow: 0 12px 28px rgba(0,100,255,0.4);
}

@keyframes cardAppear {
from {
opacity: 0;
transform: translateY(20px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

/* Сетка магазина */
.store-grid {
display: flex;
flex-direction: column;
gap: 16px;
}

.category-card {
background: var(--card-bg);
backdrop-filter: blur(10px);
border: 1px solid var(--card-border);
border-radius: 28px;
padding: 24px;
cursor: pointer;
transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
position: relative;
overflow: hidden;
}

.category-card::before {
content: '';
position: absolute;
top: 0;
left: -100%;
width: 100%;
height: 100%;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.category-card:hover::before {
left: 100%;
}

.category-card:hover {
transform: translateY(-4px) scale(1.02);
border-color: rgba(64, 224, 255, 0.5);
box-shadow: 0 16px 32px rgba(0,200,255,0.2);
}

.category-title {
font-size: 26px;
font-weight: 700;
margin-bottom: 8px;
background: linear-gradient(135deg, var(--text-color) 0%, #aaccff 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
transition: transform 0.3s ease;
}

.category-card:hover .category-title {
transform: translateX(5px);
}

.category-desc {
font-size: 15px;
color: var(--secondary-text);
font-weight: 500;
transition: color 0.3s ease;
}

.category-card:hover .category-desc {
color: var(--text-color);
}

/* Товары */
.products-grid {
display: flex;
flex-direction: column;
gap: 16px;
}

.product-card {
background: var(--card-bg);
border: 1px solid var(--card-border);
border-radius: 24px;
padding: 24px;
transition: all 0.4s ease;
animation: cardAppear 0.5s ease;
animation-fill-mode: both;
}

.product-card:nth-child(1) { animation-delay: 0.1s; }
.product-card:nth-child(2) { animation-delay: 0.15s; }
.product-card:nth-child(3) { animation-delay: 0.2s; }
.product-card:nth-child(4) { animation-delay: 0.25s; }

.product-card:hover {
transform: translateY(-2px) scale(1.01);
border-color: rgba(64, 224, 255, 0.3);
box-shadow: 0 8px 24px rgba(0,200,255,0.1);
}

.product-title {
font-size: 20px;
font-weight: 700;
margin-bottom: 12px;
display: flex;
align-items: center;
flex-wrap: wrap;
gap: 8px;
color: var(--text-color);
}

.product-price {
background: var(--button-gradient);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
font-size: 28px;
font-weight: 800;
margin: 8px 0;
}

.bonus-badge {
background: linear-gradient(135deg, #ffd700 0%, #ffb800 100%);
color: #000;
padding: 4px 12px;
border-radius: 30px;
font-size: 13px;
font-weight: 700;
display: inline-block;
margin-left: 6px;
}

.discount-badge {
background: linear-gradient(135deg, #ff4d4d 0%, #ff1a1a 100%);
color: white;
padding: 4px 12px;
border-radius: 30px;
font-size: 13px;
font-weight: 700;
display: inline-block;
margin-left: 6px;
}

.promo-badge {
background: linear-gradient(135deg, #ff3366 0%, #ff0044 100%);
color: white;
padding: 4px 12px;
border-radius: 30px;
font-size: 13px;
font-weight: 700;
display: inline-block;
animation: promoPulse 2s infinite;
}

@keyframes promoPulse {
0% { transform: scale(1); }
50% { transform: scale(1.05); }
100% { transform: scale(1); }
}

.server-badge {
background: linear-gradient(135deg, #5856d6 0%, #4a48b5 100%);
color: white;
padding: 4px 10px;
border-radius: 16px;
font-size: 11px;
display: inline-block;
margin-left: 6px;
}

/* Подкатегории */
.subgames-grid {
display: flex;
gap: 12px;
margin: 20px 0;
flex-wrap: wrap;
animation: slideUp 0.5s ease;
}

.subgame-card {
background: var(--card-bg);
border: 1px solid var(--card-border);
border-radius: 20px;
padding: 16px 20px;
cursor: pointer;
transition: all 0.3s ease;
flex: 1;
min-width: 120px;
text-align: center;
position: relative;
overflow: hidden;
font-size: 16px;
font-weight: 600;
animation: cardAppear 0.5s ease;
animation-fill-mode: both;
}

.subgame-card:nth-child(1) { animation-delay: 0.1s; }
.subgame-card:nth-child(2) { animation-delay: 0.2s; }

.subgame-card::before {
content: '';
position: absolute;
top: -2px;
left: -2px;
right: -2px;
bottom: -2px;
background: linear-gradient(90deg, #00c6ff, #0072ff, #00c6ff);
background-size: 200% 100%;
border-radius: 22px;
opacity: 0;
transition: opacity 0.3s ease;
z-index: -1;
animation: gradientShift 3s linear infinite;
}

.subgame-card:hover::before {
opacity: 1;
}

.subgame-card:hover {
transform: translateY(-2px);
}

.subgame-card:hover .subgame-icon {
transform: scale(1.1);
}

.subgame-card.active {
background: var(--button-gradient);
color: white;
border-color: transparent;
}

.subgame-icon {
display: inline-block;
font-size: 22px;
margin-right: 6px;
transition: transform 0.3s ease;
vertical-align: middle;
}

/* Кнопка назад */
.back-btn {
background: transparent;
border: 1px solid var(--card-border);
border-radius: 20px;
padding: 14px 20px;
margin-bottom: 20px;
font-size: 16px;
font-weight: 600;
cursor: pointer;
width: 100%;
color: var(--text-color);
transition: all 0.3s ease;
position: relative;
overflow: hidden;
background: var(--card-bg);
}

.back-btn:hover {
transform: translateX(-5px);
border-color: var(--button-gradient);
}

.back-btn:active {
transform: scale(0.98);
}

/* Модальное окно */
.modal-overlay {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0,0,0,0.8);
backdrop-filter: blur(10px);
display: none;
align-items: center;
justify-content: center;
z-index: 1000;
padding: 20px;
}

.modal-overlay.active {
display: flex;
}

.modal-window {
background: var(--bg-color);
border: 1px solid var(--card-border);
border-radius: 32px;
padding: 28px;
width: 100%;
max-width: 350px;
animation: scaleIn 0.4s ease;
}

.input-field {
width: 100%;
padding: 14px;
background: var(--input-bg);
border: 1px solid var(--card-border);
border-radius: 16px;
color: var(--text-color);
margin: 10px 0;
font-size: 16px;
}

.input-field:focus {
outline: none;
border-color: #00c6ff;
}

/* Игровое поле */
.game-container {
background: var(--game-bg);
border-radius: 28px;
padding: 24px;
min-height: 400px;
}

.question-box {
background: var(--card-bg);
border: 1px solid var(--card-border);
border-radius: 20px;
padding: 20px;
margin-bottom: 16px;
}

.question {
font-size: 18px;
font-weight: 700;
margin-bottom: 16px;
}

.options-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}

.option-btn {
background: var(--card-bg);
border: 1px solid var(--card-border);
border-radius: 14px;
padding: 14px;
font-size: 15px;
cursor: pointer;
transition: all 0.2s ease;
color: var(--text-color);
text-align: left;
}

.option-btn:hover {
background: var(--button-gradient);
color: white;
transform: translateX(3px);
}

.option-btn.correct {
background: linear-gradient(135deg, #00c851 0%, #007e33 100%);
color: white;
animation: correctPulse 0.5s ease;
}

.option-btn.wrong {
background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
color: white;
animation: wrongShake 0.5s ease;
}

@keyframes correctPulse {
0% { transform: scale(1); }
50% { transform: scale(1.05); }
100% { transform: scale(1); }
}

@keyframes wrongShake {
0%, 100% { transform: translateX(0); }
20%, 60% { transform: translateX(-5px); }
40%, 80% { transform: translateX(5px); }
}

.timer {
width: 100%;
height: 6px;
background: var(--card-bg);
border-radius: 3px;
margin: 16px 0;
overflow: hidden;
}

.timer-bar {
height: 100%;
background: var(--button-gradient);
border-radius: 3px;
transition: width 0.1s linear;
}

.score-box {
background: var(--card-bg);
border: 1px solid var(--card-border);
border-radius: 14px;
padding: 12px;
margin-bottom: 12px;
text-align: center;
font-size: 18px;
font-weight: 700;
}

/* Гонка */
.race-game {
position: relative;
height: 250px;
overflow: hidden;
border-radius: 18px;
background: var(--card-bg);
}

.road {
position: absolute;
bottom: 0;
left: 0;
width: 100%;
height: 100%;
background: repeating-linear-gradient(
to bottom,
var(--card-border) 0px,
var(--card-border) 40px,
var(--card-bg) 40px,
var(--card-bg) 80px
);
animation: roadMove 0.8s linear infinite;
}

@keyframes roadMove {
from { transform: translateY(0); }
to { transform: translateY(80px); }
}

.car {
position: absolute;
bottom: 40px;
left: 50%;
transform: translateX(-50%);
font-size: 40px;
filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
animation: carBounce 0.5s ease infinite;
}

@keyframes carBounce {
0%, 100% { transform: translateX(-50%) translateY(0); }
50% { transform: translateX(-50%) translateY(-3px); }
}

.click-counter {
position: absolute;
top: 15px;
left: 50%;
transform: translateX(-50%);
font-size: 36px;
font-weight: 800;
color: var(--text-color);
text-shadow: 0 0 15px rgba(0,100,255,0.5);
}

/* Бункер */
.bunker-game {
display: grid;

}

.leaderboard-item {
display: flex;
align-items: center;
gap: 10px;
padding: 10px;

transition: all 0.2s ease;
animation: slideInRight 0.4s ease;
animation-fill-mode: both;
}

.leaderboard-item:nth-child(1) { animation-delay: 0.1s; }
.leaderboard-item:nth-child(2) { animation-delay: 0.15s; }
.leaderboard-item:nth-child(3) { animation-delay: 0.2s; }
.leaderboard-item:nth-child(4) { animation-delay: 0.25s; }
.leaderboard-item:nth-child(5) { animation-delay: 0.3s; }

.leaderboard-item:hover {
transform: translateX(5px);
background: var(--game-bg);
border-radius: 10px;
}

@keyframes slideInRight {
from {
opacity: 0;
transform: translateX(20px);
}
to {
opacity: 1;
transform: translateX(0);
}
}

.rank {
width: 32px;
height: 32px;
background: var(--button-gradient);

align-items: center;

.rank-2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); }
.rank-3 { background: linear-gradient(135deg, #cd7f32, #b06d2a); }

.player-name {

font-size: 15px;
}

.player-score {

// ========== ТАБЛИЦА ЛИДЕРОВ ==========
let leaderboard = [

];

// ========== СОСТОЯНИЕ ==========
let currentSection = 0; // 0 - STORE, 1 - GAMES
let startX = 0;
let isDragging = false;

// ========== ТЕМА ==========
function toggleTheme() {
document.body.classList.toggle('dark');
document.body.classList.toggle('light');
document.getElementById('themeIcon').innerText = document.body.classList.contains('dark') ? '🌙' : '☀️';
}

// ========== СВАЙП ==========
const wrapper = document.getElementById('sectionsWrapper');
const indicators = document.querySelectorAll('.indicator');
const navBtns = document.querySelectorAll('.nav-btn');

function updateSection(index) {
if (index === currentSection) return;
currentSection = index;
wrapper.style.transform = `translateX(-${index * 50}%)`;
indicators.forEach((ind, i) => {
if (i === index) ind.classList.add('active');
else ind.classList.remove('active');
});
navBtns.forEach((btn, i) => {
if (i === index) btn.classList.add('active');
else btn.classList.remove('active');
});
const contentDiv = index === 0 ? document.getElementById('storeContent') : document.getElementById('gamesContent');
contentDiv.classList.remove('content-transition');
void contentDiv.offsetWidth;
contentDiv.classList.add('content-transition');
}

function goToSection(index) {
updateSection(index);
}

wrapper.addEventListener('touchstart', (e) => {
startX = e.touches[0].clientX;
isDragging = true;
});

wrapper.addEventListener('touchmove', (e) => {
if (!isDragging) return;
e.preventDefault();
const currentX = e.touches[0].clientX;
const diff = currentX - startX;
if (Math.abs(diff) > 50) {
if (diff > 0 && currentSection === 1) {
updateSection(0);
} else if (diff < 0 && currentSection === 0) {
updateSection(1);
}
isDragging = false;
}
});

wrapper.addEventListener('touchend', () => {
isDragging = false;
});

// ========== ПОИСК ==========
function handleSearch() {
const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('searchClear');
searchQuery = input?.value.toLowerCase().trim() || '';
if (clearBtn) {
if (searchQuery.length > 0) clearBtn.classList.add('visible');
else clearBtn.classList.remove('visible');
}
renderStore();
}

function clearSearch() {
const input = document.getElementById('searchInput');
if (input) {
input.value = '';
searchQuery = '';
const clearBtn = document.getElementById('searchClear');
if (clearBtn) clearBtn.classList.remove('visible');
renderStore();
}
}

function searchProducts(query) {
if (!query) return [];
return allProducts.filter(p => {
const searchStr = `${p.name} ${p.tags?.join(' ') || ''}`.toLowerCase();
return searchStr.includes(query);
});
}

// ========== РЕНДЕР STORE ==========
function renderStore() {
const content = document.getElementById('storeContent');
let html = `
<div class="search-container">
<div class="search-wrapper">
<input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск товаров..." value="${searchQuery}" oninput="handleSearch()">
<div class="search-clear" id="searchClear" onclick="clearSearch()">✕</div>
</div>
`;
if (searchQuery) {
const results = searchProducts(searchQuery);
if (results.length === 0) {
html += '<div class="no-results">🔍 Ничего не найдено</div>';
} else {
html += `<div class="search-results-count">Найдено: ${results.length}</div>`;
html += '<div class="products-grid">';
results.slice(0, 50).forEach(item => {
let bonus = item.bonus ? `<span class="bonus-badge">+${item.bonus}</span>` : '';
let disc = item.discount ? `<span class="discount-badge">${item.discount}₽</span>` : '';
let promo = item.promo ? `<span class="promo-badge">🔥</span>` : '';
html += `<div class="product-card">
<div class="product-title">${item.name} ${bonus} ${disc} ${promo}</div>
<div class="product-price">${item.price} ₽</div>
<button class="play-btn" onclick="openModal('${item.name}', ${item.price})">📦 Заказать</button>
</div>`;
});
html += '</div>';
}
content.innerHTML = html;
return;
}
if (currentStoreView === 'main') {
const categories = [
{ id: 'stars', icon: '⭐', name: 'Telegram Stars', desc: '1.33₽ = 1 ⭐ • Скидки' },
{ id: 'mlbb', icon: '🎮', name: 'Mobile Legends', desc: 'RU и Global серверы' },
{ id: 'genshin', icon: '⏳', name: 'Genshin Impact', desc: 'Гранулы и кристаллы' }
];
html += '<div class="store-grid">';
categories.forEach(cat => {
html += `<div class="category-card" onclick="selectStoreCategory('${cat.id}')">
<div class="category-title">${cat.icon} ${cat.name}</div>
<div class="category-desc">${cat.desc}</div>
</div>`;
});
html += '</div>';
} else if (currentStoreView === 'category') {
html = renderStoreCategory();
}
content.innerHTML = html;
}

function selectStoreCategory(category) {
currentStoreView = 'category';
currentGame = category;
currentSubgame = null;
renderStore();
}

function renderStoreCategory() {
let html = '<button class="back-btn" onclick="backToStoreMain()">◀ Вернуться</button>';
if (currentGame === 'stars') {
html += '<div style="font-size:22px;font-weight:800;margin-bottom:20px;">⭐ Telegram Stars</div>';
html += '<div class="products-grid">';
stars.forEach(item => {
let disc = item.discount ? `<span class="discount-badge">${item.discount}₽</span>` : '';

<div class="product-title">${item.name} ${disc}</div>
<div class="product-price">${item.price} ₽</div>

html += '</div>';
if (currentSubgame) {
let products = [], title = '';
if (currentSubgame === 'ru') { products = mlbbRu; title = 'RU'; }
else { products = mlbbGlobal; title = 'Global'; }
html += '<div class="products-grid">';
products.forEach(item => {

} else {

leaderboard.sort((a, b) => b.score - a.score).slice(0, 5).forEach((p, i) => {
let rc = 'rank';
if (i === 0) rc += ' rank-1';
else if (i === 1) rc += ' rank-2';
else if (i === 2) rc += ' rank-3';
html += `<div class="leaderboard-item"><div class="${rc}">${i+1}</div><div class="player-info"><div class="player-name">${p.name}</div><div class="player-score">${p.score}</div></div></div>`;

// ========== ИГРЫ ==========
function openGame(gameId) {
const content = document.getElementById('gamesContent');
content.style.animation = 'pageExit 0.3s ease';
setTimeout(() => {
if (gameId === 'brain') startBrainGame();
else if (gameId === 'race') startRaceGame();
else if (gameId === 'bunker') startBunkerGame();
content.style.animation = 'pageEnter 0.5s ease';
}, 300);
}

function startBrainGame() {
const content = document.getElementById('gamesContent');
gameState = { type: 'brain', q: 0, score: 0, qs: [
{ q: '15 × 15?', a: ['125', '150', '200', '225'], c: 3 },
{ q: 'Столица Франции?', a: ['Лондон', 'Берлин', 'Париж', 'Мадрид'], c: 2 },
{ q: 'Война и мир?', a: ['Достоевский', 'Толстой', 'Пушкин', 'Чехов'], c: 1 }
]};
renderBrainGame(content);
}

function renderBrainGame(content) {
const q = gameState.qs[gameState.q];
content.innerHTML = `
<button class="back-btn" onclick="renderGames()">◀ Выйти</button>
<div class="game-container">
<div class="score-box">⚡ ${gameState.score}</div>
<div class="question-box">
<div class="question">${q.q}</div>
<div class="options-grid">
${q.a.map((o, i) => `<button class="option-btn" onclick="answerBrain(${i})">${o}</button>`).join('')}
</div>
</div>
</div>
`;
}

function answerBrain(selected) {
const q = gameState.qs[gameState.q];
const btns = document.querySelectorAll('.option-btn');
if (selected === q.c) {
btns[selected].classList.add('correct');
gameState.score += 100;
} else {
btns[selected].classList.add('wrong');
btns[q.c].classList.add('correct');
}
gameState.q++;
setTimeout(() => {
if (gameState.q < gameState.qs.length) {
renderBrainGame(document.getElementById('gamesContent'));
} else {
finishGame('Brain Battle', gameState.score);
}
}, 1000);
}

function startRaceGame() {
const content = document.getElementById('gamesContent');
gameState = { type: 'race', clicks: 0, time: 5, timer: null };
content.innerHTML = `
<button class="back-btn" onclick="renderGames()">◀ Выйти</button>
<div class="game-container">
<div class="race-game"><div class="road"></div><div class="car">🏎️</div><div class="click-counter" id="clickCounter">0</div></div>
<button class="play-btn" onclick="raceClick()">⚡ ГАЗ!</button>
</div>
`;
gameState.timer = setInterval(() => {
gameState.time--;
if (gameState.time <= 0) {
clearInterval(gameState.timer);
finishGame('Night Race', gameState.clicks * 10);
}
}, 1000);
}

function raceClick() {
gameState.clicks++;
document.getElementById('clickCounter').textContent = gameState.clicks;
}

function startBunkerGame() {
const content = document.getElementById('gamesContent');
gameState = { type: 'bunker', survivors: [], chars: [
{ name: 'Доктор', icon: '👨‍⚕️', desc: 'Медик', sel: false },
{ name: 'Инженер', icon: '👷', desc: 'Технарь', sel: false },
{ name: 'Учитель', icon: '👩‍🏫', desc: 'Педагог', sel: false },
{ name: 'Солдат', icon: '🪖', desc: 'Охранник', sel: false }
]};
renderBunkerGame(content);
}

function renderBunkerGame(content) {
content.innerHTML = `
<button class="back-btn" onclick="renderGames()">◀ Выйти</button>
<div class="game-container">
<div class="score-box">☢️ Выбери 2</div>
<div class="bunker-game">
${gameState.chars.map((c, i) => `<div class="bunker-card ${c.sel ? 'selected' : ''}" onclick="selectSurvivor(${i})"><div class="character-icon">${c.icon}</div><div class="character-name">${c.name}</div><div class="character-desc">${c.desc}</div></div>`).join('')}
</div>
</div>
`;
}

function selectSurvivor(index) {
if (gameState.survivors.includes(index)) {
gameState.survivors = gameState.survivors.filter(i => i !== index);
gameState.chars[index].sel = false;
} else if (gameState.survivors.length < 2) {
gameState.survivors.push(index);
gameState.chars[index].sel = true;
}
if (gameState.survivors.length === 2) {
finishGame('Бункер', 200);
} else {
renderBunkerGame(document.getElementById('gamesContent'));
}
}

function finishGame(name, score) {
tg.sendData(JSON.stringify({ type: 'game', game: name, score }));
updateLeaderboard('Игрок', score);
const content = document.getElementById('gamesContent');
content.innerHTML = `
<button class="back-btn" onclick="renderGames()">◀ Вернуться</button>
<div class="game-container">
<div class="score-box" style="font-size:24px;">🏆 Игра окончена!</div>
<div class="score-box">${name}</div>
<div class="score-box">Счет: ${score}</div>
<button class="play-btn" onclick="renderGames()">🎮 К играм</button>
</div>
`;
}

function updateLeaderboard(name, score) {
leaderboard.push({ name, score });
leaderboard.sort((a, b) => b.score - a.score);
leaderboard = leaderboard.slice(0, 20);
}

function createLeague() {
tg.sendData(JSON.stringify({ type: 'league', user: tg.initDataUnsafe?.user?.username || 'Игрок' }));
tg.showAlert('👥 Частная лига создана!');
}

// ========== ЗАКАЗ ==========
function openModal(name, price) {
pendingPurchase = { name, price };
document.getElementById('modalDetails').innerHTML = `Товар: <b>${name}</b>`;
document.getElementById('modalPrice').innerText = price + ' ₽';
document.getElementById('confirmModal').classList.add('active');
}

function closeModal() {
document.getElementById('confirmModal').classList.remove('active');
}

async function confirmPurchase() {
const userVal = document.getElementById('userInput').value.trim();
if (!userVal) return tg.showAlert("Введите ваш ID!");

const btn = document.getElementById('confirmBtn');
btn.innerText = "⏳...";
btn.disabled = true;

const order = {
item: pendingPurchase.name,
price: pendingPurchase.price,
userId: userVal,
date: new Date().toLocaleString(),
customer: tg.initDataUnsafe?.user?.username || "Anonymous"
};

try {
const newRef = window.dbPush(window.dbRef(window.database, 'orders'));
await window.dbSet(newRef, order);
tg.sendData(JSON.stringify(order));
tg.showAlert("✅ Заказ успешно оформлен!");
closeModal();
} catch (e) {
tg.showAlert("❌ Ошибка: " + e.message);
} finally {
btn.innerText = "✅ Заказать";
btn.disabled = false;
}
}

// ========== СТАРТ ==========
renderStore();
renderGames();
updateSection(0);
</script>
</body>
</html>
