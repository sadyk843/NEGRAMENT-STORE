<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка NEGRAMENT</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #0a0a12; color: #e0e0e0; margin: 0; padding: 20px; }
.header { text-align: center; border-bottom: 2px solid #00c6ff; padding-bottom: 10px; margin-bottom: 20px; }
.stats { font-size: 1.2rem; color: #00c6ff; margin-bottom: 20px; text-align: center; }
#orders-list { display: grid; gap: 15px; }
.order-card { background: #161625; border: 1px solid #333; border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #00c6ff; transition: 0.3s; }
.order-card:hover { transform: scale(1.01); background: #1c1c2e; }
.info b { color: #00c6ff; font-size: 1.1rem; }
.info div { margin: 5px 0; }
.btn-done { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
.btn-done:hover { background: #218838; }
.empty-msg { text-align: center; opacity: 0.5; margin-top: 50px; }
</style>
</head>
<body>

<div class="header">
<h1>Панель управления заказами</h1>
</div>

<div class="stats">Заказов в очереди: <span id="count">0</span></div>

<div id="orders-list">Загрузка данных...</div>

<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAYmlGDDBSPstA5pcEl_0TSk5DHZW63jb4",
authDomain: "virtualstore-28707.firebaseapp.com",
projectId: "virtualstore-28707",
storageBucket: "virtualstore-28707.firebasestorage.app",
messagingSenderId: "952425585401",
appId: "1:952425585401:web:f3c90aa2ec0f643ee9a028",
measurementId: "G-8RGXYRD22N",
databaseURL: "https://virtualstore-28707-default-rtdb.europe-west1.firebasedatabase.app/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const ordersRef = ref(db, 'orders');

let isFirstLoad = true;

onValue(ordersRef, (snapshot) => {
const list = document.getElementById('orders-list');
const countDisplay = document.getElementById('count');
const data = snapshot.val();

if (!data) {
list.innerHTML = '<div class="empty-msg"><h3>Пока нет активных заказов. Отдыхаем! ☕</h3></div>';
countDisplay.innerText = "0";
return;
}

const keys = Object.keys(data);
countDisplay.innerText = keys.length;

// Если пришел новый заказ после загрузки страницы — играем звук
if (!isFirstLoad) {
document.getElementById('notif-sound').play().catch(e => console.log("Нужно кликнуть по странице для активации звука"));
}
isFirstLoad = false;

list.innerHTML = '';
keys.reverse().forEach(id => {
const order = data[id];
const card = document.createElement('div');
card.className = 'order-card';
card.innerHTML = `
<div class="info">
<div><b>${order.item || 'Без названия'}</b></div>
<div>💰 Цена: ${order.price} ₽</div>
<div>🆔 Игрок: <span style="color:#fff">${order.userId}</span></div>
<div style="font-size:0.8rem; opacity:0.6">${order.date || ''}</div>
</div>
<button class="btn-done" onclick="completeOrder('${id}')">ВЫПОЛНЕНО</button>
`;
list.appendChild(card);
});
});

window.completeOrder = (id) => {
if (confirm('Удалить заказ?')) {
remove(ref(db, 'orders/' + id));
}
};
</script>
</body>
</html>
